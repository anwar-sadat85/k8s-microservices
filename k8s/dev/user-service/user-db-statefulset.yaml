apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: dev
spec:
  clusterIP: None          # headless — gives the pod stable DNS
  selector:
    app: user-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-db
  namespace: dev
spec:
  serviceName: user-db
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: user-db-credentials
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: user-db-data
              subPath: postgres   # avoids the "lost+found" directory issue
                                    # some CSI drivers leave in the volume root
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser"]
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: user-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi